<header class="ekart-header">

  <!-- Logo -->
  <div class="ekart-logo">
    eKart
  </div>

  <!-- Navigation Area -->
  <div class="ekart-header-nav">

    <!-- Bottom Navigation -->
    <div class="ekart-bottom-bar">

      <nav class="ekart-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <!-- Search -->
      <div class="ekart-search-bar">

        <input
          type="text"
          class="ekart-search-box"
          placeholder="Search products..."
          #searchInput
          (keyup.enter)="updateSearchText()"
        />

        <div class="search-box">
        </div>

        <button
          class="ekart-search-btn"
          (click)="updateSearchText()">

          <i class="fa fa-search" aria-hidden="true"></i>

        </button>

        <button type="button" class="ekart-cart-btn" (click)="cart.open()" aria-label="Open cart">
          <i class="fa fa-shopping-cart" aria-hidden="true"></i>
          <span class="cart-count" *ngIf="(cart.itemCount$ | async) as count">{{ count }}</span>
        </button>

      </div>

    </div>

  </div>

</header>
