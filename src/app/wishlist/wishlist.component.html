<div class="drawer-backdrop" *ngIf="wishlist.isOpen$ | async" (click)="wishlist.close()"></div>

<aside class="drawer" *ngIf="wishlist.isOpen$ | async" role="dialog" aria-label="Wishlist" (click)="$event.stopPropagation()">
  <header class="drawer-header">
    <h2>Wishlist</h2>
    <button type="button" class="icon-close" (click)="wishlist.close()" aria-label="Close wishlist">×</button>
  </header>

  <ng-container *ngIf="wishlist.items$ | async as items">
    <div class="drawer-body" *ngIf="items.length; else emptyWishlist">
      <article class="cart-row" *ngFor="let product of items">
        <img [src]="product.image" [alt]="product.name">
        <div class="cart-row-info">
          <h3>{{ product.name }}</h3>
          <p>₹{{ product.price | number }}</p>
          <p class="stock-line" [class.available]="product.inStock">
            {{ product.inStock ? 'In stock' : 'Out of stock' }}
          </p>
        </div>
        <div class="cart-row-side">
          <button type="button" class="mini-btn" [disabled]="!product.inStock" (click)="moveToCart(product)">Add to cart</button>
          <button type="button" class="link-btn" (click)="wishlist.remove(product.id)">Remove</button>
        </div>
      </article>
    </div>

    <ng-template #emptyWishlist>
      <div class="empty-state">
        <p>Save products you like and they will show up here.</p>
        <button type="button" class="primary-btn" (click)="wishlist.close()">Continue browsing</button>
      </div>
    </ng-template>
  </ng-container>
</aside>
