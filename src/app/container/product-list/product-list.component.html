
<div class="product-grid" appHighlight>
  
    <div class="product-card"
     *ngFor="let product of products"
    
     >
 
      <div class="discount-badge">
      {{ product.discount }}% OFF
    </div>

    <button
      type="button"
      class="wishlist-btn"
      [class.active]="wishlist.has(product.id)"
      [attr.aria-label]="wishlist.has(product.id) ? 'Remove from wishlist' : 'Add to wishlist'"
      (click)="toggleWishlist(product)">
      {{ wishlist.has(product.id) ? '♥' : '♡' }}
    </button>

    <div class="product-image">
      <button class="product-image-button" type="button" (click)="productSelected.emit(product)" [attr.aria-label]="'View details for ' + product.name">
        <img [src]="product.image" [alt]="product.name">
      </button>
    </div>

    <div class="product-details">
      <span class="product-category">{{ product.category }}</span>
      <h3><button class="product-name-button" type="button" (click)="productSelected.emit(product)">{{ product.name }}</button></h3>

      <div class="rating">
        <span>★★★★★</span>
        <small>{{ product.rating }} ({{ product.reviews }} Reviews)</small>
      </div>

      <div class="price">
        <span class="current-price">₹{{ product.price | number }}</span>
        <span class="old-price">₹{{ product.oldPrice | number }}</span>
      </div>

      <p class="stock" [class.available]="product.inStock" [class.low-stock]="!product.inStock">
        {{ product.inStock ? '✓ In Stock' : '✕ Out of Stock' }}
      </p>

      <div class="product-actions">
        <button class="cart-btn" [disabled]="!product.inStock" AppHover (click)="addToCart(product)">Add to Cart</button>
        <button class="buy-btn" [disabled]="!product.inStock" AppHover (click)="buyNow(product)">Buy Now</button>
      </div>
    </div>
  </div>
</div>
